{% extends 'base.html' %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-0 shadow-lg p-4 p-md-5 text-center">
                    <div class="badge bg-danger-subtle text-danger p-3 rounded-circle d-inline-block mx-auto mb-3" style="width: fit-content;">
                        <i class="bi bi-exclamation-triangle fs-1"></i>
                    </div>
                    <h3 class="fw-bold mb-2">Delete Resource?</h3>
                    <p class="text-secondary mb-4">
                        Are you sure you want to permanently delete <strong>"{{ book.title }}"</strong>?
                        This action cannot be undone.
                    </p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3">
                            <a href="{% url 'manage-resources' %}" class="btn btn-light px-4">Cancel</a>
                            <button type="submit" class="btn btn-danger px-4">Confirm Delete</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
